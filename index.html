<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="theme-color" content="#0b5f86">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Briefing</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#15181b;--mut:#5b6670;--line:#e3e7ea;--acc:#0b5f86;--band:#eef5f9;--up:#137a46;--dn:#b3261e;--bar:rgba(255,255,255,.92)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1417;--ink:#e9edf0;--mut:#9aa6b0;--line:#26303a;--acc:#5fb6e0;--band:#17222b;--up:#43c483;--dn:#ff7b72;--bar:rgba(15,20,23,.92)}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font:800 26px/1.1 -apple-system,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.sub{font-size:13px;opacity:.85;margin-top:2px}
.hbtn{display:flex;gap:6px}
.hbtn button,.hbtn select{font:600 15px system-ui;color:#fff;background:rgba(255,255,255,.16);border:0;border-radius:10px;min-height:40px;padding:0 12px}
.hbtn select option{color:#000}
main{max-width:760px;margin:0 auto;padding:0 16px}
.view{display:none}.view.on{display:block}
h2{font:800 28px/1.1 system-ui;margin:22px 0 10px}
h3{font:700 13px system-ui;text-transform:none;color:var(--acc);margin:20px 0 4px;padding-top:8px;border-top:2px solid var(--ink)}
.key{background:var(--band);border-radius:14px;padding:14px 16px;margin-top:16px}
.key ul{margin:6px 0 0;padding-left:20px}.key li{margin-bottom:6px}
.it{display:block;padding:12px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.it b{display:block;font-size:17px;line-height:1.3}
.it p{margin:4px 0;color:var(--ink);opacity:.9;font-size:15.5px}
.src{font-size:13px;color:var(--mut)}
.empty{color:var(--mut);font-style:italic;padding:8px 0}
.navbox{background:var(--band);border-radius:14px;padding:16px;margin-top:16px}
.nm{font-size:13px;color:var(--mut)}
.big{font:800 clamp(34px,10vw,44px)/1.05 system-ui;white-space:nowrap;margin-top:4px}
.chg{font:800 19px system-ui}.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) 5.4em minmax(0,1fr);gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.row small{display:block;color:var(--mut);font-size:12px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.bar{position:relative;height:12px}.bar::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;border-left:1px solid var(--mut)}
.bar i{position:absolute;top:0;height:100%;border-radius:2px}
.an p{margin:0 0 12px}
.note{font-size:13px;color:var(--mut);margin:10px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;color:var(--mut);font:600 11px system-ui;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--acc)}
.status{padding:40px 0;color:var(--mut);text-align:center}
.foot{font-size:12px;color:var(--mut);padding:24px 0}
.offline{display:none;background:#b3261e;color:#fff;font-size:13px;text-align:center;padding:4px}
body.off .offline{display:block}
</style>
</head>
<body>
<div class="offline">Sin conexión · mostrando la última edición guardada</div>
<header>
  <div class="hrow">
    <div><h1>Briefing</h1><div class="sub" id="date">Cargando…</div></div>
    <div class="hbtn"><select id="pick" aria-label="Edición"></select><button id="refresh" aria-label="Actualizar">↻</button></div>
  </div>
</header>
<main>
  <section class="view on" id="v-hoy"></section>
  <section class="view" id="v-actualidad"></section>
  <section class="view" id="v-deportes"></section>
  <section class="view" id="v-mercados"></section>
  <section class="view" id="v-seguros"></section>
  <div class="foot" id="foot"></div>
</main>
<nav class="tabs" id="tabs">
  <button data-v="hoy" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
  <button data-v="actualidad"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>Actualidad</button>
  <button data-v="deportes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/></svg>Deportes</button>
  <button data-v="mercados"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Mercados</button>
  <button data-v="seguros"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Seguros</button>
</nav>
<script>
{
const APP_VERSION='1.0.0';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const fmtDate=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}catch(e){return d}};
const fmtN=(n,dec=2)=>typeof n==='number'?n.toLocaleString('es-ES',{minimumFractionDigits:dec,maximumFractionDigits:dec}):'—';
const sign=n=>typeof n!=='number'?'s/d':(n>0?'+':'')+fmtN(n)+' %';
const cls=n=>typeof n!=='number'?'':(n>=0?'up':'dn');
const items=l=>!l||!l.length?'<p class="empty">Sin noticias relevantes.</p>':l.map(i=>{const u=safeUrl(i.url);const inner=`<b>${esc(i.t)}</b><p>${esc(i.s)}</p><span class="src">${esc(i.src||'')}</span>`;return u?`<a class="it" href="${esc(u)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="it">${inner}</div>`}).join('');
const grp=(n,l)=>`<h3>${esc(n)}</h3>${items(l)}`;
function fund(f){
  if(!f)return '<p class="empty">Sin datos del fondo.</p>';
  const q=f.quotes||[];const max=Math.max(1,...q.map(x=>Math.abs(x.chg||0)));
  const rows=q.map(x=>{const w=Math.abs(x.chg||0)/max*50,p=(x.chg||0)>=0;return `<div class="row"><div>${esc(x.name)}<small>${esc(x.ticker)}${x.w!=null?' · '+fmtN(x.w,1)+' %':''}${x.close!=null?' · '+fmtN(x.close)+' '+esc(x.cur||''):''}</small></div><div class="num ${cls(x.chg)}">${sign(x.chg)}</div><div class="bar"><i style="left:${p?50:50-w}%;width:${w}%;background:var(${p?'--up':'--dn'})"></i></div></div>`}).join('');
  return `<div class="navbox"><div class="nm">${esc(f.name)} · ${esc(f.isin)}</div><div class="big">${f.nav!=null?fmtN(f.nav)+' €':'—'}</div><div class="chg ${cls(f.navChg)}">${f.navChg!=null?sign(f.navChg):''}</div><div class="src">Valor liquidativo ${esc(f.navDate||'')}${f.navSrc?' · '+esc(f.navSrc):''}</div></div>
  <h3>Principales posiciones · ${esc(f.quotesDate||'')}</h3>${rows}<p class="note">Cartera según ${esc(f.holdingsAsOf||'última ficha')}.</p>
  <h3>Lectura del día</h3><div class="an">${(f.analysis||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</div>
  ${f.watch&&f.watch.length?`<h3>A vigilar</h3><ul>${f.watch.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}
  ${f.news&&f.news.length?grp('Noticias de las empresas',f.news):''}
  <p class="note">Comentario informativo de mercado, no recomendación de inversión.</p>`;
}
function render(d){
  const n=d.news||{};
  $('#date').textContent=fmtDate(d.date);
  const f=d.fund;
  $('#v-hoy').innerHTML=`<div class="key"><b>Lo esencial</b><ul>${(d.key||[]).map(k=>`<li>${esc(k)}</li>`).join('')}</ul></div>
    ${f?`<div class="navbox" style="display:flex;justify-content:space-between;align-items:center"><div><div class="nm">Tu PIAS</div><b>${esc(f.name)}</b></div><button class="go" data-go="mercados" style="font:600 15px system-ui;border:0;border-radius:10px;min-height:44px;padding:0 14px;background:var(--acc);color:#fff">Ver</button></div>`:''}
    ${grp('Vigo',(n.vigo||[]).slice(0,2))}${grp('Celta',(n.celta||[]).slice(0,1))}${grp('Daños materiales',(n.dm||[]).slice(0,1))}`;
  $('#v-actualidad').innerHTML=`<h2>Actualidad</h2>${grp('Vigo',n.vigo)}${grp('Galicia',n.galicia)}${grp('España',n.espana)}`;
  $('#v-deportes').innerHTML=`<h2>Deportes</h2>${grp('Celta de Vigo',n.celta)}${grp('UFC',n.ufc)}${grp('Fórmula 1',n.f1)}`;
  $('#v-mercados').innerHTML=`<h2>Mercados</h2>${fund(f)}`;
  $('#v-seguros').innerHTML=`<h2>Seguros</h2>${grp('Daños materiales',n.dm)}${grp('Corredurías y mercado',n.broker)}`;
  $('#foot').textContent=`Versión ${APP_VERSION}${d.generatedAt?' · edición generada '+new Date(d.generatedAt).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}`;
}
function show(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  window.scrollTo(0,0);try{localStorage.setItem('tab',v)}catch(e){}
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)});
$('main').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)show(b.dataset.go)});
async function getJSON(u){const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
async function getCached(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
async function loadEdition(date){
  let d;try{d=await getJSON('data/'+date+'.json')}catch(e){d=await getCached('data/'+date+'.json')}
  render(d);
}
async function load(){
  let idx;
  try{idx=await getJSON('data/index.json');document.body.classList.remove('off')}
  catch(e){try{idx=await getCached('data/index.json')}catch(e2){idx=null}document.body.classList.add('off')}
  if(!idx||!idx.dates||!idx.dates.length){$('#v-hoy').innerHTML='<div class="status">Aún no hay ediciones.</div>';$('#date').textContent='';return}
  $('#pick').innerHTML=idx.dates.map(d=>`<option value="${esc(d)}">${esc(d.slice(8,10)+'/'+d.slice(5,7))}</option>`).join('');
  try{await loadEdition(idx.dates[0])}catch(e){$('#v-hoy').innerHTML='<div class="status">No se pudo cargar la edición.</div>'}
}
$('#pick').addEventListener('change',e=>loadEdition(e.target.value).catch(()=>{}));
$('#refresh').addEventListener('click',()=>load());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
try{const t=localStorage.getItem('tab');if(t)show(t)}catch(e){}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
load();
}
</script>
</body>
</html>
